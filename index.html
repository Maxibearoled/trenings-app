<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <title>Treningsapp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login-boks">
    <h1>Treningsapp</h1>
    <input type="text" id="navn-input" placeholder="Skriv navnet ditt">
    <button onclick="loggInn()">Logg inn</button>
  </div>

  <div id="app" style="display: none;">
    <div class="topp">
      <h2 id="velkommen"></h2>
      <p>Poeng: <span id="poeng-tekst">0</span></p>
      <button onclick="loggUt()">Logg ut</button>
    </div>

    <div class="boks">
      <h3>Ferdige treningsplaner</h3>
      <button onclick="velgPlan('nybegynner')">Fullkropp Nybegynner</button>
      <button onclick="velgPlan('styrke')">Styrke 3 dager</button>
      <button onclick="velgPlan('kondis')">Kondisjon</button>
    </div>

    <div class="boks">
      <h3>Ukeplan</h3>
      <div id="dager-knapper">
        <button onclick="byttDag('Mandag')">Mandag</button>
        <button onclick="byttDag('Tirsdag')">Tirsdag</button>
        <button onclick="byttDag('Onsdag')">Onsdag</button>
        <button onclick="byttDag('Torsdag')">Torsdag</button>
        <button onclick="byttDag('Fredag')">Fredag</button>
        <button onclick="byttDag('Lørdag')">Lørdag</button>
        <button onclick="byttDag('Søndag')">Søndag</button>
      </div>

      <h4 id="valgt-dag-tittel">Mandag</h4>
      <input type="text" id="ovelse-input" placeholder="Ny øvelse (f.eks. 3x10 Benkpress)">
      <button onclick="leggTilOvelse()">Legg til</button>

      <ul id="ovelse-liste"></ul>
    </div>

    <div class="boks">
      <h3>Leaderboard</h3>
      <ul id="leaderboard-liste"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
